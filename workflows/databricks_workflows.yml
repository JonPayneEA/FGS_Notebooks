# =============================================================================
# workflows/databricks_workflows.yml
# Databricks Workflows definitions for the pipeline (Asset Bundle resources).
#
# Included by ../databricks.yml. Deploy with:
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run fgs_polling_workflow
#
# USE EITHER THESE WORKFLOWS OR THE master/ NOTEBOOKS, NOT BOTH. They run the
# same cadences; scheduling both would run every job twice.
#
# Notebook paths are relative to this file, so nothing depends on where the
# repo is mounted. Set the cluster in databricks.yml (variable cluster_id).
#
# Workflows:
#   1. fgs_polling_workflow   -- FGS ingest + intersections, and flood warnings
#   2. fgs_weekly_workflow    -- weekly, Sunday 02:00 UTC
#   3. fgs_quarterly_workflow -- quarterly (or run manually after an election)
#   4. ea_rt_daily_workflow   -- daily EA real-time archive ingest
#
# FIRST RUN: run 02_backfill_fgs once, then 07_compute_intersections once with
# recompute_all=true, before enabling the schedules.
# =============================================================================

resources:
  jobs:

    # -------------------------------------------------------------------------
    # WORKFLOW 1: POLLING
    # The ingest notebook checks the polling window itself (config.py, UTC) and
    # exits cleanly outside it, so the schedule can fire all day.
    #
    #   ingest_fgs --> compute_intersections --> fgs_contacts
    #                                             (runs even if ingest found
    #                                              nothing new, or failed, so a
    #                                              failed intersection run is
    #                                              retried; it exits "no_work"
    #                                              quickly when idle)
    #   flood_warnings --> warning_contacts       (independent of the FGS tasks:
    #                                              never blocked by them; contacts
    #                                              rebuild even if the warnings
    #                                              ingest failed, from the last
    #                                              good current state)
    #
    #   Products (plain SQL, run after the tasks above whatever their outcome):
    #   compute_intersections --> fgs_changes
    #   fgs_contacts + warning_contacts + fgs_changes --> constituency_situation
    #   constituency_situation --> mp_briefing_drafts   (DRAFTS ONLY, nothing is sent)
    #   constituency_situation + mp_briefing_drafts --> pipeline_health
    #                                              (fails the run if a check fails,
    #                                               so alerts fire)
    #
    # Runs every 15 minutes. The EA real-time API and the EA flood warnings API both
    # refresh every 15 minutes, so this is the finest cadence that adds anything. Every
    # task is idempotent and exits quickly when there is nothing new. If a run can take
    # longer than 15 minutes, the next one is skipped (max_concurrent_runs: 1), so check
    # the run durations before going finer, and slacken the cron if they approach 15.
    # -------------------------------------------------------------------------
    fgs_polling_workflow:
      name: "FGS Polling Workflow"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"   # Every 15 minutes
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        # Live EA real-time readings, every site. Independent of every other task (no
        # depends_on), so it is never blocked by the FGS steps and never blocks them.
        # Its failure should not fail the FGS alert path: leave it out of any task that
        # depends on it, and rely on the ea_live_readings_age health check (it warns,
        # never fails). It skips itself if filled in the last 10 minutes.
        - task_key: "ea_rt_live"
          description: "Latest EA real-time reading for every measure into ea_rt_readings_live"
          notebook_task:
            notebook_path: "../jobs/23_ea_rt_live_readings.ipynb"
            base_parameters:
              min_age_minutes: "10"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 180

        - task_key: "ingest_fgs"
          description: "Poll FFC API and ingest a new or modified FGS if available"
          notebook_task:
            notebook_path: "../jobs/01_ingest_fgs.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "compute_intersections"
          description: "Intersect statements lacking an up-to-date log entry"
          depends_on:
            - task_key: "ingest_fgs"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/07_compute_intersections.ipynb"
            base_parameters:
              recompute_all: "false"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 600

        - task_key: "fgs_contacts"
          description: "Rebuild the latest FGS forecast x constituencies x MP contact details"
          depends_on:
            - task_key: "compute_intersections"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/14_fgs_constituency_contacts.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "flood_warnings"
          description: "Fetch EA flood warnings and alerts; update current state and log"
          notebook_task:
            notebook_path: "../jobs/11_flood_warnings_ingest.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "warning_contacts"
          description: "Rebuild current warnings x constituencies x MP contact details"
          depends_on:
            - task_key: "flood_warnings"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/13_warning_constituency_contacts.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "fgs_changes"
          description: "What changed since the previous FGS, per constituency, day and source"
          depends_on:
            - task_key: "compute_intersections"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/18_fgs_changes.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "constituency_situation"
          description: "One row per constituency: forecast, warnings and MP"
          depends_on:
            - task_key: "fgs_contacts"
            - task_key: "warning_contacts"
            - task_key: "fgs_changes"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/19_constituency_flood_situation.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "mp_briefing_drafts"
          description: "Draft briefings for MPs whose constituency is forecast at risk (never sent)"
          depends_on:
            - task_key: "constituency_situation"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/20_mp_briefing_drafts.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "pipeline_health"
          description: "Age and completeness checks on the pipeline outputs; fails if a check fails"
          depends_on:
            - task_key: "constituency_situation"
            - task_key: "mp_briefing_drafts"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/22_pipeline_health.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        # Start, end and duration of every alert and warning, from the stored message history
        # and flood_warnings_log. Last, so it never delays the FGS and warnings steps, and it
        # skips itself when built less than an hour ago and the log has nothing newer. Needs
        # its one-off load first: run 25_warning_history_periods by hand once with source_path
        # set. Master_polling runs this step as non-fatal; as a task here its failure fails the
        # run, so remove it from any alerting that should only watch the FGS path.
        - task_key: "warning_history"
          description: "Episodes and periods of alerts and warnings, with start, end and duration"
          depends_on:
            - task_key: "flood_warnings"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/25_warning_history_periods.ipynb"
            base_parameters:
              skip_if_fresh_minutes: "60"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 600


    # -------------------------------------------------------------------------
    # WORKFLOW 2: WEEKLY REFRESH
    #   refresh_ea_flood_areas \
    #                           --> compute_lookup
    #   refresh_mp_details     /
    #
    # The two refreshes run in parallel.
    #
    # Historical intersections are deliberately NOT recomputed here. Each statement
    # keeps the intersections computed when it was issued, so the tables stay an
    # archive of what was recommended at the time. New statements are intersected
    # by the polling workflow. For a full recompute, run 07_compute_intersections
    # by hand with recompute_all = true.
    # -------------------------------------------------------------------------
    fgs_weekly_workflow:
      name: "FGS Weekly Refresh"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"   # Sunday 02:00 UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "refresh_ea_flood_areas"
          description: "Refresh EA Flood Warning and Flood Alert Areas"
          notebook_task:
            notebook_path: "../jobs/03_refresh_ea_flood_areas.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "refresh_mp_details"
          description: "Refresh MP contact details from Parliament API"
          notebook_task:
            notebook_path: "../jobs/04_refresh_mp_details.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "compute_lookup"
          description: "Recompute EA area / constituency lookup table"
          depends_on:
            - task_key: "refresh_ea_flood_areas"
            - task_key: "refresh_mp_details"
          notebook_task:
            notebook_path: "../jobs/06_compute_lookup.ipynb"
          existing_cluster_id: ${var.cluster_id}



    # -------------------------------------------------------------------------
    # WORKFLOW 3: QUARTERLY BOUNDARY REFRESH
    # Run manually straight after a general election or boundary review; do not
    # wait for the schedule. Also run the weekly workflow to refresh MPs.
    #
    #   refresh_boundaries --> compute_lookup
    #
    # Statements already issued keep the intersections computed against the
    # boundaries of their time. New statements use the new boundaries.
    # -------------------------------------------------------------------------
    fgs_quarterly_workflow:
      name: "FGS Quarterly Boundary Refresh"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 3 1 1,4,7,10 ?"   # 03:00 UTC, first day of each quarter
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "refresh_boundaries"
          description: "Refresh parliamentary constituency boundaries from ONS"
          notebook_task:
            notebook_path: "../jobs/05_refresh_boundaries.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "compute_lookup"
          description: "Recompute EA area / constituency lookup table"
          depends_on:
            - task_key: "refresh_boundaries"
          notebook_task:
            notebook_path: "../jobs/06_compute_lookup.ipynb"
          existing_cluster_id: ${var.cluster_id}


    # -------------------------------------------------------------------------
    # WORKFLOW 4: EA REAL-TIME DAILY ARCHIVE
    # The archive file for a day is generated at 22:00 the following day, so
    # this runs at 23:00 UTC. 10_ea_rt_daily_archive registers any new measures
    # itself (it calls 09_ea_rt_measure_register), and exits "no_file" -- which
    # fails this run -- if the file is not yet available.
    # -------------------------------------------------------------------------
    ea_rt_daily_workflow:
      name: "EA Real-Time Daily Archive"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 23 * * ?"   # 23:00 UTC daily
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "daily_archive"
          description: "Land yesterday's EA readings archive to Bronze"
          notebook_task:
            notebook_path: "../jobs/10_ea_rt_daily_archive.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 7200

        # Independent of the archive: runs even if the file is not yet available.
        - task_key: "fgs_exposure"
          description: "Days each constituency was forecast at each FGS risk rank, by month and source"
          notebook_task:
            notebook_path: "../jobs/21_fgs_constituency_exposure.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 1800

        # Reads the warning episodes that the polling job keeps current.
        - task_key: "fgs_verification"
          description: "FGS forecast risk against the alerts and warnings in force, by constituency, date and lead day"
          notebook_task:
            notebook_path: "../jobs/26_fgs_forecast_verification.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 3600
