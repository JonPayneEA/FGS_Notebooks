# =============================================================================
# workflows/databricks_workflows.yml
# Databricks Workflows definitions for the pipeline (Asset Bundle resources).
#
# Included by ../databricks.yml. Deploy with:
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run fgs_polling_workflow
#
# USE EITHER THESE WORKFLOWS OR THE master/ NOTEBOOKS, NOT BOTH. They run the
# same cadences; scheduling both would run every job twice.
#
# Notebook paths are relative to this file, so nothing depends on where the
# repo is mounted. Set the cluster in databricks.yml (variable cluster_id).
#
# Workflows:
#   1. fgs_polling_workflow   -- FGS ingest + intersections, and flood warnings
#   2. fgs_weekly_workflow    -- weekly, Sunday 02:00 UTC
#   3. fgs_quarterly_workflow -- quarterly (or run manually after an election)
#   4. ea_rt_daily_workflow   -- daily EA real-time archive ingest
#
# FIRST RUN: run 02_backfill_fgs once, then 07_compute_intersections once with
# recompute_all=true, before enabling the schedules.
# =============================================================================

resources:
  jobs:

    # -------------------------------------------------------------------------
    # WORKFLOW 1: POLLING
    # The ingest notebook checks the polling window itself (config.py, UTC) and
    # exits cleanly outside it, so the schedule can fire all day.
    #
    #   ingest_fgs --> compute_intersections      (runs even if ingest found
    #                                              nothing new, or failed, so a
    #                                              failed intersection run is
    #                                              retried; it exits "no_work"
    #                                              quickly when idle)
    #   flood_warnings --> warning_contacts       (independent of the FGS tasks:
    #                                              never blocked by them; contacts
    #                                              rebuild even if the warnings
    #                                              ingest failed, from the last
    #                                              good current state)
    #
    # Adjust the cron to the cadence you can run (every 30 or 60 minutes).
    # -------------------------------------------------------------------------
    fgs_polling_workflow:
      name: "FGS Polling Workflow"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"   # Every 30 minutes
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "ingest_fgs"
          description: "Poll FFC API and ingest a new or modified FGS if available"
          notebook_task:
            notebook_path: "../jobs/01_ingest_fgs.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "compute_intersections"
          description: "Intersect statements lacking an up-to-date log entry"
          depends_on:
            - task_key: "ingest_fgs"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/07_compute_intersections.ipynb"
            base_parameters:
              recompute_all: "false"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 600

        - task_key: "flood_warnings"
          description: "Fetch EA flood warnings and alerts; update current state and log"
          notebook_task:
            notebook_path: "../jobs/11_flood_warnings_ingest.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300

        - task_key: "warning_contacts"
          description: "Rebuild current warnings x constituencies x MP contact details"
          depends_on:
            - task_key: "flood_warnings"
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "../jobs/13_warning_constituency_contacts.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 300


    # -------------------------------------------------------------------------
    # WORKFLOW 2: WEEKLY REFRESH
    #   refresh_ea_flood_areas \
    #                           --> compute_lookup --> recompute_intersections
    #   refresh_mp_details     /
    #
    # The two refreshes run in parallel. recompute_all is safe to run weekly:
    # each statement's rows are replaced, never duplicated.
    # -------------------------------------------------------------------------
    fgs_weekly_workflow:
      name: "FGS Weekly Refresh"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"   # Sunday 02:00 UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "refresh_ea_flood_areas"
          description: "Refresh EA Flood Warning and Flood Alert Areas"
          notebook_task:
            notebook_path: "../jobs/03_refresh_ea_flood_areas.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "refresh_mp_details"
          description: "Refresh MP contact details from Parliament API"
          notebook_task:
            notebook_path: "../jobs/04_refresh_mp_details.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "compute_lookup"
          description: "Recompute EA area / constituency lookup table"
          depends_on:
            - task_key: "refresh_ea_flood_areas"
            - task_key: "refresh_mp_details"
          notebook_task:
            notebook_path: "../jobs/06_compute_lookup.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "recompute_intersections"
          description: "Recompute all FGS intersections against refreshed EA areas"
          depends_on:
            - task_key: "compute_lookup"
          notebook_task:
            notebook_path: "../jobs/07_compute_intersections.ipynb"
            base_parameters:
              recompute_all: "true"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 7200


    # -------------------------------------------------------------------------
    # WORKFLOW 3: QUARTERLY BOUNDARY REFRESH
    # Run manually straight after a general election or boundary review; do not
    # wait for the schedule. Also run the weekly workflow to refresh MPs.
    #
    #   refresh_boundaries --> compute_lookup --> recompute_intersections
    # -------------------------------------------------------------------------
    fgs_quarterly_workflow:
      name: "FGS Quarterly Boundary Refresh"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 3 1 1,4,7,10 ?"   # 03:00 UTC, first day of each quarter
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "refresh_boundaries"
          description: "Refresh parliamentary constituency boundaries from ONS"
          notebook_task:
            notebook_path: "../jobs/05_refresh_boundaries.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "compute_lookup"
          description: "Recompute EA area / constituency lookup table"
          depends_on:
            - task_key: "refresh_boundaries"
          notebook_task:
            notebook_path: "../jobs/06_compute_lookup.ipynb"
          existing_cluster_id: ${var.cluster_id}

        - task_key: "recompute_intersections"
          description: "Recompute all FGS intersections against new boundaries"
          depends_on:
            - task_key: "compute_lookup"
          notebook_task:
            notebook_path: "../jobs/07_compute_intersections.ipynb"
            base_parameters:
              recompute_all: "true"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 7200


    # -------------------------------------------------------------------------
    # WORKFLOW 4: EA REAL-TIME DAILY ARCHIVE
    # The archive file for a day is generated at 22:00 the following day, so
    # this runs at 23:00 UTC. 10_ea_rt_daily_archive registers any new measures
    # itself (it calls 09_ea_rt_measure_register), and exits "no_file" -- which
    # fails this run -- if the file is not yet available.
    # -------------------------------------------------------------------------
    ea_rt_daily_workflow:
      name: "EA Real-Time Daily Archive"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 23 * * ?"   # 23:00 UTC daily
        timezone_id: "UTC"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: "daily_archive"
          description: "Land yesterday's EA readings archive to Bronze"
          notebook_task:
            notebook_path: "../jobs/10_ea_rt_daily_archive.ipynb"
          existing_cluster_id: ${var.cluster_id}
          timeout_seconds: 7200
